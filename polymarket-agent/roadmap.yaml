agent:
  id: "polymarket-agent"
  name: "Polymarket Trading Agent"
  path: "../polymarket-agent"
  entry: "main.py"
  enabled: true

schedule:
  frequency: "daily"
  run_at: "06:00"
  max_runtime_minutes: 60   # long-running — scan + track cycle

depends_on: []

inputs:
  memory_keys: []
  upstream_outputs: []

outputs:
  - key: "bets_placed"
    description: "Number of new bets placed this scan"
    type: "int"
  - key: "open_exposure"
    description: "Current open exposure in USD"
    type: "float"
  - key: "live_bankroll"
    description: "Current live bankroll after settled bets"
    type: "float"
  - key: "open_bets"
    description: "Number of currently open bets"
    type: "int"

tasks:
  # ── Recurrent (run every day) ──────────────────────────────────────────
  - id: "scan_markets"
    description: "Fetch and score active Polymarket markets, place qualifying bets"
    status: "active"
    priority: "high"
    recurrent: true
    depends_on: []

  - id: "track_resolutions"
    description: "Poll open bets for resolution, stop-loss, take-profit triggers"
    status: "active"
    priority: "high"
    recurrent: true
    depends_on: ["scan_markets"]

  # ── v0.1 one-shot tasks ────────────────────────────────────────────────
  - id: "env_example"
    description: "Create .env.example with all config vars and one-line comments"
    status: "active"
    priority: "medium"
    recurrent: false
    depends_on: []

  - id: "coingecko_cache_fix"
    description: "Fix cache key to coin_id only; add exponential backoff on 429s"
    status: "active"
    priority: "medium"
    recurrent: false
    depends_on: []

  - id: "order_fill_confirmation"
    description: "Poll get_order() after posting; mark pending_fill if unmatched"
    status: "active"
    priority: "medium"
    recurrent: false
    depends_on: []

  - id: "live_mode_banner"
    description: "Add red LIVE MODE banner to reporter.py terminal dashboard"
    status: "active"
    priority: "low"
    recurrent: false
    depends_on: []

  - id: "llm_stricter_live"
    description: "Require confidence=high or edge > MIN_EDGE*2 for LLM signals in live mode"
    status: "active"
    priority: "medium"
    recurrent: false
    depends_on: []

  - id: "graceful_shutdown"
    description: "Print open positions table on Ctrl+C; warn if live bets are open"
    status: "active"
    priority: "low"
    recurrent: false
    depends_on: []

  - id: "cooldown_bug_fix"
    description: "Add resolved_at column; cooldown window starts at resolution, not placement"
    status: "active"
    priority: "low"
    recurrent: false
    depends_on: []

memory:
  last_run: null
  last_status: null
  last_output: {}
  notes: "v0.1 stabilization in progress. Live mode active with $100 bankroll."
